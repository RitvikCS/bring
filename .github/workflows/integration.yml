name: Integration

# Runs the real-container tests (Docker + the Dev Containers CLI) that the
# fast CI job skips. Bring depends on an open range of @devcontainers/cli,
# so the weekly run installs the LATEST upstream release on top of the
# lockfile: an upstream change that breaks Bring fails here, not for users.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the latest Dev Containers CLI (weekly and manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save @devcontainers/cli@latest
          npx devcontainer --version
      # `npm run` puts node_modules/.bin on PATH, so the tests find the
      # bundled `devcontainer`; Docker is preinstalled on the runner.
      - run: npm run test:integration
